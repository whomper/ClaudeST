name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Bridge and layout tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: make test
        run: make test

  atari:
    name: Atari build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The m68k cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-m68k-linux-gnu
      - name: Build the program
        run: make
      - name: The build changed no tracked file
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        with:
          name: claudest-dev
          path: binary/
